spring.application.name=jooq-mcp

# MCP Server Configuration
spring.ai.mcp.server.name=jooq-documentation-mcp
spring.ai.mcp.server.version=@project.version@
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.base-url=
spring.ai.mcp.server.protocol=streamable

# Keep-alive pings on the streamable-HTTP SSE streams. They keep idle streams open through
# proxies, but a failed ping does NOT remove the session: the SDK only logs and swallows
# the error. Session cleanup comes from the idle timeout below.
spring.ai.mcp.server.streamable-http.keep-alive-interval=30s

# Session eviction, applied by McpTransportConfiguration (Spring AI does not expose these).
# A session that receives no request for idle-timeout is closed and removed, which also
# completes its SSE stream and frees the Tomcat request behind it. A client that comes back
# afterwards gets 404 and re-initializes, as the MCP spec requires.
# Without this, abandoned sessions accumulated until the heap ran out.
jooq-mcp.session.idle-timeout=1h
jooq-mcp.session.max-sessions=1000

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Pinecone Configuration
pinecone.api-key=${PINECONE_API_KEY}
pinecone.index-name=jooq-docs

# Search Tuning
search.semantic-weight=0.7
search.keyword-weight=0.3
search.default-limit=5

# Embedding CLI (one-time seeding)
# Seeding replaces the whole Pinecone index with the manual below.
embedding.generate=false
embedding.manual-url=https://www.jooq.org/doc/latest/manual-markdown/jOOQ-manual-3.21.md
embedding.chunk-size=1000
embedding.chunk-overlap=200

# Server Configuration - Fix SSE buffer overflow
server.tomcat.max-http-response-header-size=64KB
server.tomcat.max-swallow-size=10MB

# Actuator - Health monitoring
# Only health is exposed: the endpoint is reachable from the public internet and
# /actuator/metrics leaks internal state (request URIs, JVM sizing, thread counts).
# Health still returns 503 when DOWN, so external uptime monitoring keeps working.
# To debug a live instance, temporarily widen the exposure without a redeploy:
#   fly secrets set MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,metrics
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.metrics.enable.jvm=true
management.metrics.enable.system=true

# Logging
logging.level.ch.martinelli.jooqmcp=INFO
logging.level.org.springframework.ai=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
